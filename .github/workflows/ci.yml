name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, build, test
    runs-on: ubuntu-latest
    # Backend tests are integration tests; they create and migrate `hacknation_test` here.
    services:
      postgres:
        image: postgres:19-alpine
        env:
          POSTGRES_USER: hacknation
          POSTGRES_PASSWORD: hacknation
          POSTGRES_DB: hacknation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hacknation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: hacknation
      DB_PASSWORD: hacknation
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain

      - run: pnpm turbo run lint check-types build test

      # openapi.json and the generated client types are committed; a contract
      # change without `pnpm generate` would silently desync front, back and workers.
      - name: Generated contract is up to date
        run: |
          pnpm generate
          git diff --exit-code -- packages/contracts/openapi.json packages/api-client/src/generated

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build only, never push: catches Dockerfile and C++ compile breakage on the PR.
      - name: Backend image
        run: docker build -f apps/backend/Dockerfile .

      - name: nmap worker image
        run: docker build apps/workers/nmap-worker
