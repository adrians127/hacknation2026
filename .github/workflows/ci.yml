name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain

      - run: pnpm turbo run lint check-types build test

      # openapi.json and the generated client types are committed; a contract
      # change without `pnpm generate` would silently desync front, back and workers.
      - name: Generated contract is up to date
        run: |
          pnpm generate
          git diff --exit-code -- packages/contracts/openapi.json packages/api-client/src/generated

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build only, never push: catches Dockerfile and C++ compile breakage on the PR.
      - name: Backend image
        run: docker build -f apps/backend/Dockerfile .

      - name: nmap worker image
        run: docker build apps/workers/nmap-worker

      - name: masscan worker image
        run: docker build apps/workers/masscan-worker
