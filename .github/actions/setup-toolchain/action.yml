name: Set up toolchain
description: Node + pnpm, pinned and shared by every workflow.

runs:
  using: composite
  steps:
    - name: Set up pnpm
      # No version input: it reads `packageManager` from the root package.json.
      uses: pnpm/action-setup@v6

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
