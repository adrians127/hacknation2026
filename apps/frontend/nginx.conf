# The SubSurf frontend in Docker (apps/frontend/Dockerfile): the static build, and the API
# proxied to the backend container under the same origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Target imports (10 MB) and their JSON envelope.
    client_max_body_size 16m;

    location /v1/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        # With the port: the backend compares it with the browser's Origin (CSRF check).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Vite fingerprints everything under /assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/app/...) all load index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
